openapi: 3.1.0
info:
  title: Accessible Onboarding & Career Gateway API
  version: 1.0.0
  description: |
    Multi-tenant, platform-independent backend for the Accessible Onboarding &
    Career Gateway. All protected resources are scoped to an **organizationId**
    derived from the authenticated principal.

    ## Security
    - **BearerAuth** â€“ JWT issued by `/api/v1/org/auth/login`. Scopes encoded
      in the token (`org_admin`, `employer`, `partner`). Org admin â‰  employer â‰  partner.
    - **ApiKeyAuth** â€“ opaque key sent in the `X-Api-Key` header for
      server-to-server integrations.
    - Public routes require no credentials.
    - Widget endpoints accept only the public `widgetKey` opaque identifier and
      never grant administrative access.

  contact:
    name: Gateway Platform Team
  license:
    name: Private

servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: http://localhost:4000/api/v1
    description: Local development

tags:
  - name: Widget
    description: Embeddable widget configuration (public)
  - name: Onboarding
    description: Learner onboarding sessions and draft management
  - name: Partners
    description: Partner referral and learner consent records
  - name: Jobs
    description: Public job board
  - name: Applications
    description: Job applications (learner view)
  - name: OrgAuth
    description: Organisation authentication (login / refresh / logout)
  - name: OrgMembers
    description: Organisation member management (org admin)
  - name: OrgConfig
    description: Organisation platform configuration (org admin)
  - name: OrgCredentials
    description: API integration credentials (org admin)
  - name: EmployerJobs
    description: Employer job management
  - name: EmployerAccommodations
    description: Employer accommodation detail management
  - name: EmployerApplications
    description: Employer application review

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# PATHS
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
paths:

  # â”€â”€ Widget â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /widget/{widgetKey}/config:
    get:
      operationId: getWidgetConfig
      tags: [Widget]
      summary: Fetch embeddable widget configuration
      description: >
        Returns the public configuration for a widget identified by its opaque
        `widgetKey`. No authentication required. The key never grants admin
        access.
      parameters:
        - $ref: '#/components/parameters/widgetKey'
      responses:
        '200':
          description: Widget configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetConfig'
              example:
                organizationName: Sunrise Staffing
                primaryColor: '#1A73E8'
                logoUrl: https://cdn.example.com/sunrise-logo.png
                welcomeMessage: Welcome to Sunrise â€” let's get you started.
                enableSmsResume: true
                enablePartnerReferral: true
                jobBoardEnabled: true
                supportedLanguages: [en, am]
                defaultLanguage: en
        '404':
          $ref: '#/components/responses/NotFound'

  # â”€â”€ Capabilities â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /capabilities:
    get:
      operationId: getCapabilities
      tags: [Onboarding]
      summary: Server capability flags
      description: Returns feature-flag snapshot; used by the frontend at startup.
      responses:
        '200':
          description: Capability flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              example:
                serverDraftsEnabled: true
                smsResumeEnabled: true

  # â”€â”€ Onboarding sessions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /onboarding/sessions:
    post:
      operationId: startOnboardingSession
      tags: [Onboarding]
      summary: Start a new onboarding session
      description: >
        Creates a server-side onboarding session and returns a `sessionId` and
        a short-lived `draftToken` the client uses to resume later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isSharedDevice, registrationMode]
              properties:
                isSharedDevice:
                  type: boolean
                  description: >
                    Signals that personal data should be cleared from the device
                    after submission.
                registrationMode:
                  $ref: '#/components/schemas/RegistrationMode'
                widgetKey:
                  type: string
                  description: Optional â€” associates the session with a widget tenant.
            example:
              isSharedDevice: false
              registrationMode: self
              widgetKey: wk_sunrise_abc123
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, draftToken, expiresAtIso]
                properties:
                  sessionId:
                    type: string
                  draftToken:
                    type: string
                    description: Short-lived opaque token for SMS resume flow.
                  expiresAtIso:
                    type: string
                    format: date-time
              example:
                sessionId: sess_01HXYZ123
                draftToken: dt_abcdef789
                expiresAtIso: '2026-11-15T10:52:46Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /onboarding/sessions/{sessionId}/draft:
    parameters:
      - $ref: '#/components/parameters/sessionId'
    get:
      operationId: getOnboardingDraft
      tags: [Onboarding]
      summary: Retrieve the current draft for a session
      security:
        - SessionTokenAuth: []
      responses:
        '200':
          description: Current draft state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingDraft'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateOnboardingDraft
      tags: [Onboarding]
      summary: Save / update the onboarding draft
      security:
        - SessionTokenAuth: []
      description: >
        Idempotent upsert. The client may call this repeatedly as the user
        progresses through the form. `supportNotes` are stored server-side and
        **must never** be surfaced in employer-facing responses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingDraft'
            example:
              isSharedDevice: false
              registrationMode: self
              fullName: Amara Tesfaye
              contactMethod: email
              contactValue: amara@example.com
              identityRoute: none
              identityReferenceNumber: ''
              partnerReferralOrg: ''
              supportPreferences: [sign-language, written-instructions]
              supportNotes: Prefers written instructions for all communication.
              updatedAtIso: '2026-11-14T10:00:00Z'
      responses:
        '200':
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingDraft'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /onboarding/sessions/{sessionId}/submit:
    post:
      operationId: submitOnboardingSession
      tags: [Onboarding]
      summary: Submit a completed onboarding session
      description: >
        Finalises the session. Returns a `SubmissionReceipt`. If
        `isSharedDevice` was set, the response body will instruct the client to
        clear local storage.
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                partnerConsent:
                  $ref: '#/components/schemas/ConsentRecord'
      responses:
        '200':
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionReceipt'
              example:
                id: sub_01HABC999
                submittedAtIso: '2026-11-14T10:52:46Z'
                mode: online
                persistedToServer: true
                notice: Your profile has been saved. A counsellor will be in touch.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # Legacy submission endpoint (frontend contract compatibility)
  /onboarding/submissions:
    post:
      operationId: submitOnboardingDirect
      tags: [Onboarding]
      summary: Direct onboarding submission (legacy frontend contract)
      description: >
        Accepts a full `OnboardingDraft` without a prior session. Maintained for
        frontend compatibility. Prefer the session-based flow for new clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingDraft'
      responses:
        '200':
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /onboarding/resume-sms:
    post:
      operationId: resumeViaSms
      tags: [Onboarding]
      summary: Send an SMS link so the learner can resume their draft later
      description: >
        Sends a one-time SMS containing a magic link with the `draftToken`.
        Accommodation filter parameters and `supportNotes` are **never**
        included in the SMS payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, draftToken]
              properties:
                phone:
                  type: string
                  description: E.164-formatted phone number.
                  pattern: '^\+[1-9]\d{6,14}$'
                draftToken:
                  type: string
            example:
              phone: '+251911234567'
              draftToken: dt_abcdef789
      responses:
        '200':
          description: SMS dispatch result
          content:
            application/json:
              schema:
                type: object
                required: [sent, message]
                properties:
                  sent:
                    type: boolean
                  message:
                    type: string
              example:
                sent: true
                message: Resume link sent to +251911234567.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'

  # â”€â”€ Partners & Consent â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /partners/referrals:
    post:
      operationId: createPartnerReferral
      tags: [Partners]
      summary: Submit a partner referral for a learner
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [learnerName, partnerOrganizationName, referralReason]
              properties:
                learnerName:
                  type: string
                partnerOrganizationName:
                  type: string
                referralReason:
                  type: string
                contactValue:
                  type: string
                  description: >
                    Optional contact (email or phone) for follow-up. Not
                    shared without explicit consent.
                notes:
                  type: string
                  description: >
                    Internal referral notes â€” **never** surfaced to employers.
            example:
              learnerName: Amara Tesfaye
              partnerOrganizationName: Hope Employment Center
              referralReason: Work-readiness training graduate
              contactValue: amara@example.com
      responses:
        '201':
          description: Referral created
          content:
            application/json:
              schema:
                type: object
                required: [referralId, createdAtIso]
                properties:
                  referralId:
                    type: string
                  createdAtIso:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /consent/{consentId}:
    parameters:
      - name: consentId
        in: path
        required: true
        schema:
          type: string
        description: Opaque consent record identifier.
    get:
      operationId: getConsentRecord
      tags: [Partners]
      summary: Retrieve a consent record
      responses:
        '200':
          description: Consent record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: recordConsent
      tags: [Partners]
      summary: Record learner consent
      description: >
        Records explicit learner consent before any accommodation request or
        personal data is shared with an employer or partner. Consent is
        **required** before `shareAccommodationRequest` takes effect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRecord'
            example:
              learnerConsented: true
              consentLanguage: en
              partnerOrganizationName: Hope Employment Center
              representativeName: Meron Alemu
              sharedFieldsSummary: Name, contact, accommodation category
              recordedAtIso: '2026-11-14T10:30:00Z'
      responses:
        '200':
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  # â”€â”€ Jobs (public) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /jobs:
    get:
      operationId: listJobs
      tags: [Jobs]
      summary: Search the public job board
      description: >
        Returns `JobPosting[]` matching the query. The `accommodations` filter
        parameter is applied server-side only and **must never be stored** or
        linked to an applicant identity.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Free-text search term (title, skills, description).
        - name: accommodations
          in: query
          schema:
            type: string
          description: >
            Comma-separated accommodation category filter.
            **Never stored per applicant.**
        - name: employmentType
          in: query
          schema:
            $ref: '#/components/schemas/EmploymentType'
        - name: isRemote
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of job postings
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, limit]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobPosting'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      operationId: createJobLegacy
      tags: [Jobs]
      summary: Create a job posting (legacy frontend contract)
      description: >
        Legacy endpoint maintained for frontend compatibility. New integrations
        should use `POST /employer/jobs` instead (requires employer JWT).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/jobId'
    get:
      operationId: getJob
      tags: [Jobs]
      summary: Get a single job posting
      responses:
        '200':
          description: Job posting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPosting'
        '404':
          $ref: '#/components/responses/NotFound'

  # â”€â”€ Job Applications (learner) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /jobs/{jobId}/applications:
    post:
      operationId: applyForJob
      tags: [Applications]
      summary: Submit a job application
      description: >
        The `shareAccommodationRequest` field requires `explicitConsentToShare`
        to be `true`. If consent is absent or false, accommodation details are
        **not forwarded** to the employer.
      parameters:
        - $ref: '#/components/parameters/jobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobApplicationDraft'
            example:
              jobId: job_01HXYZ456
              applicantName: Amara Tesfaye
              contactValue: amara@example.com
              relevantExperience: 3 years in customer support and data entry.
              shareAccommodationRequest: true
              accommodationRequestNote: Need screen-reader-compatible interface.
              explicitConsentToShare: true
      responses:
        '201':
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionReceipt'
              example:
                id: app_01HABC111
                submittedAtIso: '2026-11-14T11:00:00Z'
                mode: online
                persistedToServer: true
                notice: Your application has been received.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/applicationId'
    get:
      operationId: getLearnerApplication
      tags: [Applications]
      summary: Learner view of their own application
      description: >
        Returns the learner's own application record. Does **not** include
        internal support notes, employer review notes, or private filters.
      responses:
        '200':
          description: Learner application record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearnerApplicationRecord'
        '404':
          $ref: '#/components/responses/NotFound'

  /applications/{applicationId}/consent:
    parameters:
      - $ref: '#/components/parameters/applicationId'
    put:
      operationId: updateApplicationConsent
      tags: [Applications]
      summary: Update consent for sharing accommodation with employer
      description: >
        Allows the learner to grant or revoke explicit consent to share their
        accommodation request with the employer. Revocation must be honoured
        immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [explicitConsentToShare]
              properties:
                explicitConsentToShare:
                  type: boolean
      responses:
        '200':
          description: Consent updated
          content:
            application/json:
              schema:
                type: object
                required: [applicationId, explicitConsentToShare, updatedAtIso]
                properties:
                  applicationId:
                    type: string
                  explicitConsentToShare:
                    type: boolean
                  updatedAtIso:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # â”€â”€ Org Auth â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /org/auth/login:
    post:
      operationId: orgLogin
      tags: [OrgAuth]
      summary: Organisation member login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
            example:
              email: admin@sunrise.example.com
              password: s3cur3P@ss!
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /org/auth/refresh:
    post:
      operationId: orgRefreshToken
      tags: [OrgAuth]
      summary: Refresh an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /org/auth/logout:
    post:
      operationId: orgLogout
      tags: [OrgAuth]
      summary: Invalidate the current session / refresh token
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

