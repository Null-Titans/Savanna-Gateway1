  # â”€â”€ Org Credentials â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  /org/credentials:
    post:
      operationId: createCredential
      tags: [OrgCredentials]
      summary: Create a new API integration credential
      description: >
        Returns the plaintext API key **once**. Store it securely â€” it cannot
        be retrieved again.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  description: Human-readable label for this credential.
                  maxLength: 100
                scopes:
                  type: array
                  items:
                    type: string
                  description: >
                    Permitted scopes for this key (e.g. `referrals:write`).
      responses:
        '201':
          description: Credential created â€” plaintext key shown once
          content:
            application/json:
              schema:
                type: object
                required: [credentialId, label, apiKey, createdAtIso]
                properties:
                  credentialId:
                    type: string
                  label:
                    type: string
                  apiKey:
                    type: string
                    description: Plaintext key â€” shown once only.
                  scopes:
                    type: array
                    items:
                      type: string
                  createdAtIso:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      operationId: listCredentials
      tags: [OrgCredentials]
      summary: List API integration credentials (metadata only)
      description: Returns credential metadata. The plaintext key is never returned.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Credential list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /org/credentials/{credentialId}:
    parameters:
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeCredential
      tags: [OrgCredentials]
      summary: Revoke and delete an API credential
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Credential revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

