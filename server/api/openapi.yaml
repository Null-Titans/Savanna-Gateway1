      properties:
        applicationId:
          type: string
        jobId:
          type: string
        applicantName:
          type: string
        contactValue:
          type: string
        relevantExperience:
          type: string
        shareAccommodationRequest:
          type: boolean
        explicitConsentToShare:
          type: boolean
        status:
          type: string
          enum: [submitted, reviewing, shortlisted, rejected]
        submittedAtIso:
          type: string
          format: date-time

