# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# COMPONENTS
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
components:

  # â”€â”€ Security Schemes â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT issued at `/api/v1/org/auth/login`. The token payload contains
        `organizationId`, `memberId`, and `scope` (`org_admin` | `employer` |
        `partner`). Scopes are mutually exclusive â€” an org admin token does not
        grant employer access and vice-versa.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >
        Opaque API key for server-to-server integrations. Keys are created at
        `POST /api/v1/org/credentials` and scoped to specific operations.
        Stored server-side as SHA-256(key + per-key salt). Never logged or
        returned after initial creation.
    SessionTokenAuth:
      type: apiKey
      in: header
      name: X-Session-Token
      description: >
        Short-lived opaque session token returned by `POST /onboarding/sessions`.
        Stored in-memory on the client only — never in localStorage, URLs, or
        analytics payloads. Used to authenticate draft save and submit calls
        for anonymous learners. Token value is hashed server-side (SHA-256)
        before storage. Never logged in access logs.

  # â”€â”€ Parameters â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  parameters:
    widgetKey:
      name: widgetKey
      in: path
      required: true
      schema:
        type: string
      description: Opaque public widget identifier. Never grants admin access.

    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: Onboarding session identifier returned by `POST /onboarding/sessions`.

    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
      description: Unique job posting identifier.

    applicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
      description: Unique job application identifier.

  # â”€â”€ Responses â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  responses:
    BadRequest:
      description: Validation error or malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Validation failed
            code: VALIDATION_ERROR
            details:
              - field: contactValue
                message: Must be a valid email address or E.164 phone number

    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
            code: AUTH_REQUIRED

    Forbidden:
      description: Authenticated but insufficient scope / permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Forbidden
            code: INSUFFICIENT_SCOPE

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Not found
            code: NOT_FOUND

    Conflict:
      description: Resource already exists or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Conflict
            code: DUPLICATE_RESOURCE

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the client may retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Too many requests
            code: RATE_LIMITED

    BadGateway:
      description: Upstream service (e.g. SMS provider) returned an error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: SMS provider unavailable
            code: UPSTREAM_ERROR

    ServiceUnavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Service temporarily unavailable
            code: SERVICE_UNAVAILABLE

  # â”€â”€ Schemas â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  schemas:

    # â”€â”€ Primitives & Enums â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    RegistrationMode:
      type: string
      enum: [self, partner_assisted]
      description: >
        `self` â€” the learner is registering independently;
        `assisted` â€” a support worker is helping;
        `partner-referred` â€” a partner organisation initiated the session.

    EmploymentType:
      type: string
      enum: ['Full-time', 'Part-time', 'Apprenticeship', 'Contract', 'Fellowship']

    OrgRole:
      type: string
      enum: [org_admin, employer, partner, support_worker]
      description: >
        JWT scope values. `org_admin` â‰  `employer` â‰  `partner` â€” tokens are
        issued per scope and do not carry combined permissions.

    AccommodationCategory:
      type: string
      enum:
        - remote_flexible
        - flexible_hours
        - screen_reader_tools
        - accessible_workplace
        - assistive_tech
        - communication_support
        - other_accommodations

    ContactMethod:
      type: string
      enum: [email, phone, sms]

    # â”€â”€ Core Domain Schemas â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    OnboardingDraft:
      type: object
      required:
        - isSharedDevice
        - registrationMode
        - updatedAtIso
      description: >
        The learner's in-progress onboarding form state. `supportNotes` are
        stored server-side and **must never appear** in employer-facing
        responses. No field may require a disability diagnosis, medical proof,
        or government-issued kebele ID.
      properties:
        isSharedDevice:
          type: boolean
        registrationMode:
          $ref: '#/components/schemas/RegistrationMode'
        fullName:
          type: string
          maxLength: 200
        contactMethod:
          $ref: '#/components/schemas/ContactMethod'
        contactValue:
          type: string
          description: Email address or E.164 phone number depending on `contactMethod`.
        identityRoute:
          type: string
          description: >
            Optional self-selected identity path (e.g. `none`, `refugee-id`,
            `national-id`). Never requires medical or diagnosis documentation.
        identityReferenceNumber:
          type: string
          description: >
            Reference number for the chosen identity route. Optional and
            never mandatory.
        partnerReferralOrg:
          type: string
        supportPreferences:
          type: array
          items:
            type: string
          description: >
            Self-reported support preferences (e.g. `sign-language`,
            `written-instructions`). Never stored as a disability diagnosis.
        supportNotes:
          type: string
          description: >
            Free-text notes from support workers. **Private â€” never expose to
            employers or in public responses.**
        partnerConsent:
          $ref: '#/components/schemas/ConsentRecord'
        updatedAtIso:
          type: string
          format: date-time
      example:
        isSharedDevice: false
        registrationMode: self
        fullName: Amara Tesfaye
        contactMethod: email
        contactValue: amara@example.com
        identityRoute: none
        identityReferenceNumber: ''
        partnerReferralOrg: ''
        supportPreferences: [written-instructions]
        supportNotes: Prefers written communication.
        updatedAtIso: '2026-11-14T09:00:00Z'

    ConsentRecord:
      type: object
      required:
        - learnerConsented
        - consentLanguage
        - partnerOrganizationName
        - representativeName
        - sharedFieldsSummary
        - recordedAtIso
      description: >
        Records explicit, informed consent before personal data or
        accommodation details are shared. Must be collected before any
        disclosure to employers or partner organisations.
      properties:
        learnerConsented:
          type: boolean
        consentLanguage:
          type: string
          description: BCP 47 language tag for the language in which consent was given.
          example: en
        partnerOrganizationName:
          type: string
        representativeName:
          type: string
        sharedFieldsSummary:
          type: string
          description: Plain-language description of what will be shared.
        recordedAtIso:
          type: string
          format: date-time

    JobPosting:
      type: object
      required:
        - id
        - title
        - organization
        - location
        - isRemote
        - employmentType
        - descriptionSummary
        - requiredSkills
        - accommodationCategories
        - accommodationsOffered
        - accommodationDetails
        - postedAtIso
        - isDemoData
      properties:
        id:
          type: string
        title:
          type: string
        organization:
          type: string
        location:
          type: string
        isRemote:
          type: boolean
        employmentType:
          $ref: '#/components/schemas/EmploymentType'
        descriptionSummary:
          type: string
        requiredSkills:
          type: array
          items:
            type: string
        accommodationCategories:
          type: array
          items:
            $ref: '#/components/schemas/AccommodationCategory'
        accommodationsOffered:
          type: array
          items:
            type: string
          description: >
            Human-readable list of specific accommodations offered. Matches
            frontend type (string[]). Never includes applicant data.
        accommodationDetails:
          $ref: '#/components/schemas/EmployerAccommodationDetails'
        applicationDeadline:
          type: string
          format: date
        postedAtIso:
          type: string
          format: date-time
        isDemoData:
          type: boolean
          description: True when the posting is seeded demo / sample data.
      example:
        id: job_01HXYZ456
        title: Customer Support Specialist
        organization: Sunrise Staffing
        location: Addis Ababa, Ethiopia
        isRemote: false
        employmentType: full-time
        descriptionSummary: Handle inbound customer queries via chat and phone.
        requiredSkills: [communication, Amharic, English]
        accommodationCategories: [mobility, hearing]
        accommodationsOffered: true
        accommodationDetails:
          workEnvironmentAccessibility: Wheelchair-accessible office
          remoteOrFlexibleArrangements: Flexible start times available
          assistiveTechnologyAvailable: Screen-reader-compatible desktop
          communicationOptions: Written instructions on request
          interviewAccommodations: Remote interview available
          applicationProcessAccommodations: Extended deadline on request
          additionalSupportOffered: Job coach introduction available
        applicationDeadline: '2026-12-31'
        postedAtIso: '2026-11-01T08:00:00Z'
        isDemoData: false

    EmployerAccommodationDetails:
      type: object
      description: >
        Structured accommodation information provided by the employer. Shown to
        applicants on the public job board. Must not include any personal
        applicant data.
      properties:
        workEnvironmentAccessibility:
          type: string
        remoteOrFlexibleArrangements:
          type: string
        assistiveTechnologyAvailable:
          type: string
        communicationOptions:
          type: string
        interviewAccommodations:
          type: string
        applicationProcessAccommodations:
          type: string
        additionalSupportOffered:
          type: string

    CreateJobRequest:
      type: object
      required:
        - title
        - location
        - isRemote
        - employmentType
        - descriptionSummary
        - requiredSkills
        - accommodationCategories
        - accommodationsOffered
      properties:
        title:
          type: string
          maxLength: 200
        location:
          type: string
        isRemote:
          type: boolean
        employmentType:
          $ref: '#/components/schemas/EmploymentType'
        descriptionSummary:
          type: string
          maxLength: 2000
        requiredSkills:
          type: array
          items:
            type: string
        accommodationCategories:
          type: array
          items:
            $ref: '#/components/schemas/AccommodationCategory'
        accommodationsOffered:
          type: array
          items:
            type: string
          description: >
            Human-readable list of specific accommodations offered. Matches
            frontend type (string[]). Never includes applicant data.
        accommodationDetails:
          $ref: '#/components/schemas/EmployerAccommodationDetails'
        applicationDeadline:
          type: string
          format: date

    JobApplicationDraft:
      type: object
      required:
        - jobId
        - applicantName
        - contactValue
        - explicitConsentToShare
      description: >
        Job application submitted by a learner. `shareAccommodationRequest`
        requires `explicitConsentToShare: true`. Accommodation details are
        **not forwarded** to the employer without consent.
      properties:
        jobId:
          type: string
        applicantName:
          type: string
        contactValue:
          type: string
        relevantExperience:
          type: string
        shareAccommodationRequest:
          type: boolean
          default: false
        accommodationRequestNote:
          type: string
          description: >
            Accommodation note shared **only** when `shareAccommodationRequest`
            is true AND `explicitConsentToShare` is true.
        explicitConsentToShare:
          type: boolean
          description: >
            Must be true before any accommodation detail is disclosed to the
            employer. Required field â€” cannot be omitted.

    SubmissionReceipt:
      type: object
      required:
        - id
        - submittedAtIso
        - mode
        - persistedToServer
        - notice
      properties:
        id:
          type: string
        submittedAtIso:
          type: string
          format: date-time

    # ── Support Request (private — learner/case-worker only) ────────────────────
    SupportRequest:
      type: object
      required:
        - supportPreferences
        - submittedAtIso
      description: >
        A private support request submitted by a learner. This resource is
        **never accessible to employers** via any API path. Access is limited
        to the submitting learner (via session token) and org-level
        support_worker/org_admin roles. Retention period is configurable per
        organization (default: 90 days after case closure). Learners may
        request deletion at any time.

        **Why not just a boolean:** A boolean `hasSupportRequest` flag on the
        submission record is insufficient for the actual support workflow.
        Support workers need to know what kind of assistance was requested so
        they can assign appropriate resources. This schema captures that
        without exposing the data to employers.
      properties:
        supportRequestId:
          type: string
        sessionId:
          type: string
        organizationId:
          type: string
          description: Scoped — only the org that received the submission can access.
        supportPreferences:
          type: array
          items:
            type: string
            enum:
              - help_completing
              - communication_assistance
              - alternative_materials
              - flexible_scheduling
              - other_support
              - discuss_privately
          description: >
            Self-selected support categories. Stored server-side, never
            exposed to employers, never stored as a diagnosis or medical label.
        supportNotes:
          type: string
          description: >
            Free-text notes from the learner or an assisting support worker.
            Encrypted at rest (AES-256-GCM). Access: session-owner or
            support_worker/org_admin only. Never returned in job-search,
            application, or employer API responses.
        status:
          type: string
          enum: [open, in_progress, resolved, closed]
        assignedTo:
          type: string
          description: memberId of the support_worker assigned to this request (internal).
        retentionExpiresAtIso:
          type: string
          format: date-time
          description: >
            Date after which the record will be purged per the org's data
            retention policy. Learner can request earlier deletion.
        createdAtIso:
          type: string
          format: date-time
        updatedAtIso:
          type: string
          format: date-time
        mode:
          type: string
          enum: [mock, real]
        persistedToServer:
          type: boolean
        notice:
          type: string
          description: Human-readable confirmation message shown to the user.

    ErrorResponse:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Machine-readable error code.
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
          description: Per-field validation errors (present on 400 responses).

    Capabilities:
      type: object
      required:
        - serverDraftsEnabled
        - smsResumeEnabled
      properties:
        serverDraftsEnabled:
          type: boolean
        smsResumeEnabled:
          type: boolean

    WidgetConfig:
      type: object
      required:
        - organizationName
        - primaryColor
        - enableSmsResume
        - enablePartnerReferral
        - jobBoardEnabled
        - supportedLanguages
        - defaultLanguage
      properties:
        organizationName:
          type: string
        primaryColor:
          type: string
          description: CSS hex colour.
        logoUrl:
          type: string
          format: uri
        welcomeMessage:
          type: string
        enableSmsResume:
          type: boolean
        enablePartnerReferral:
          type: boolean
        jobBoardEnabled:
          type: boolean
        supportedLanguages:
          type: array
          items:
            type: string
            description: BCP 47 language tag.
        defaultLanguage:
          type: string
          description: BCP 47 language tag.

    AuthTokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - expiresInSeconds
        - scope
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
        scope:
          $ref: '#/components/schemas/OrgRole'
        organizationId:
          type: string
        memberId:
          type: string

    OrgMember:
      type: object
      required:
        - memberId
        - email
        - role
        - isActive
        - joinedAtIso
      properties:
        memberId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
        isActive:
          type: boolean
        joinedAtIso:
          type: string
          format: date-time

    OrgConfig:
      type: object
      description: >
        Organisation-level platform configuration. Scoped to the authenticated
        principal's `organizationId`.
      properties:
        organizationName:
          type: string
        primaryColor:
          type: string
        logoUrl:
          type: string
          format: uri
        welcomeMessage:
          type: string
        enableSmsResume:
          type: boolean
        enablePartnerReferral:
          type: boolean
        jobBoardEnabled:
          type: boolean
        serverDraftsEnabled:
          type: boolean
        supportedLanguages:
          type: array
          items:
            type: string
        defaultLanguage:
          type: string
        allowedRegistrationModes:
          type: array
          items:
            $ref: '#/components/schemas/RegistrationMode'

    CredentialSummary:
      type: object
      required:
        - credentialId
        - label
        - createdAtIso
      description: API key metadata. The plaintext key is never returned after creation.
      properties:
        credentialId:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
        lastUsedAtIso:
          type: string
          format: date-time
        createdAtIso:
          type: string
          format: date-time

    LearnerApplicationRecord:
      type: object
      required:
        - applicationId
        - jobId
        - applicantName
        - status
        - submittedAtIso
      description: >
        The learner's own view of their application. Does **not** include
