        is true.
      properties:
        applicationId:
          type: string
        jobId:
          type: string
        applicantName:
          type: string
        contactValue:
          type: string
          description: Shown only after consent is confirmed.
        relevantExperience:
          type: string
        shareAccommodationRequest:
